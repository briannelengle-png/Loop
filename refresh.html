<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Refresh Loop</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif;
      background:#000; color:#f5f5f7; margin:0; padding:32px 20px;
    }
    .box { max-width:520px; margin:0 auto; }
    h1 { font-size:24px; }
    p { color:#aaa; line-height:1.5; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Refreshing Loop…</h1>
    <p>This clears Loop’s cached app files only. It does not delete the IndexedDB task database.</p>
  </div>
  <script>
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ("caches" in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
        }
      } catch (e) {
        console.error(e);
      }
      const url = new URL("./", location.href);
      url.searchParams.set("fresh", Date.now().toString());
      location.replace(url.toString());
    })();
  </script>
</body>
</html>
